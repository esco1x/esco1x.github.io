<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Bread · Roblox login</title>
  <link rel="stylesheet" href="./style.css?v=20261112-clean2">
  <script src="./callback.js?v=20261112-clean2" defer></script>
</head>
<body>
  <main>
    <header>
      <span class="brand">BREAD<span>.</span></span>
      <span class="service">Roblox login</span>
    </header>
    <div class="content">
      <h1 id="title">Link your Roblox account</h1>
      <p id="status" role="status">Run <code>/roblox login</code> in Discord to get started.</p>
      <section id="result-panel" hidden aria-label="Complete your login">
        <label for="result">Login result</label>
        <textarea id="result" rows="4" readonly spellcheck="false" autocomplete="off" aria-describedby="privacy expiry"></textarea>
        <button id="copy" type="button">Copy login result</button>
        <p id="copy-status" role="status" aria-live="polite"></p>
        <p id="expiry" class="notice" role="status">Use within one minute of authorizing.</p>
        <p id="privacy">Keep this private. Only paste it into Bread's Login form in Discord.</p>
      </section>
      <noscript>Enable JavaScript, or paste this page's full callback URL into Bread's Login form in Discord.</noscript>
    </div>
    <footer>Not affiliated with Roblox.</footer>
  </main>
</body>
</html>
