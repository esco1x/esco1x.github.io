<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fortnite leaks, projects, and socials from @eggrial." />
  <title>eggrial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #18181a;
      --surface-hover: #1f1f22;
      --border: #2c2c30;
      --border-hover: #3d3d42;
      --text: #ededed;
      --muted: #94949a;
      --focus: #e4e4e7;
      --radius: 12px;
      --safe-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 400px;
      margin: 0 auto;
      padding: 2rem 1.25rem var(--safe-bottom);
    }

    .profile {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--surface);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name {
      font-size: clamp(1.375rem, 4vw, 1.625rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 0 0 0.4rem;
      line-height: 1.2;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: 0.875rem;
      max-width: 30ch;
      margin-inline: auto;
      line-height: 1.45;
    }

    .links-primary {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1.05rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      color: inherit;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .link-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .link-card:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .link-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
      opacity: 0.92;
    }

    .link-body {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .link-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0;
    }

    .link-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0.2rem 0 0;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .links-secondary-label {
      margin: 1.15rem 0 0.5rem;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .links-secondary {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
    }

    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.42rem 0.72rem;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .link-chip:hover {
      background: var(--surface);
      border-color: var(--border-hover);
    }

    .link-chip:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .link-chip svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
    }
  </style>
</head>
