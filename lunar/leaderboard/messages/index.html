<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Weekly Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Base Page ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #0f0f0f 0%, #050505 100%);
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1rem;
    }

    h1 {
      font-weight: 700;
      font-size: 2.8rem;
      color: #b26eff;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(178, 110, 255, 0.4);
    }

    h2 {
      font-weight: 400;
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 2rem;
      letter-spacing: 0.5px;
    }

    /* ===== Leaderboard Container ===== */
    .leaderboard {
      width: 100%;
      max-width: 700px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(178, 110, 255, 0.2);
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(178, 110, 255, 0.05);
      overflow: hidden;
      animation: fadeIn 0.6s ease forwards;
    }

    .leaderboard-header,
    .leaderboard-row {
      display: grid;
      grid-template-columns: 60px 1fr 70px;
      align-items: center;
      padding: 1rem 1.5rem;
    }

    .leaderboard-header {
      background: rgba(178, 110, 255, 0.15);
      color: #b26eff;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(178, 110, 255, 0.2);
      letter-spacing: 0.8px;
    }

    .leaderboard-row {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(25, 25, 25, 0.8);
      transition: background 0.2s, transform 0.2s;
    }

    .leaderboard-row:hover {
      background: rgba(178, 110, 255, 0.1);
      transform: translateY(-2px);
    }

    .rank {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #b26eff;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.5rem 0.8rem;
      border-radius: 10px;
    }

    .user img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(178, 110, 255, 0.5);
      object-fit: cover;
    }

    .username {
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      transition: text-shadow 0.3s, color 0.3s;
    }

    /* ===== Glowing Usernames (Lunar Purple Theme) ===== */
    .first-place .username {
      color: #b26eff;
      text-shadow: 0 0 10px rgba(178, 110, 255, 0.9), 0 0 20px rgba(178, 110, 255, 0.6);
      animation: pulsePurple 1.8s infinite alternate;
    }

    .second-place .username {
      color: #c390ff;
      text-shadow: 0 0 8px rgba(195, 144, 255, 0.8), 0 0 16px rgba(195, 144, 255, 0.5);
      animation: pulsePurple 2s infinite alternate;
    }

    .third-place .username {
      color: #d1a8ff;
      text-shadow: 0 0 6px rgba(209, 168, 255, 0.7), 0 0 14px rgba(209, 168, 255, 0.4);
      animation: pulsePurple 2.2s infinite alternate;
    }

    @keyframes pulsePurple {
      from {
        text-shadow: 0 0 8px rgba(178, 110, 255, 0.4);
      }

      to {
        text-shadow: 0 0 20px rgba(178, 110, 255, 1);
      }
    }

    .messageCount {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #b26eff;
    }

    /* ===== Loading ===== */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      font-size: 1rem;
      color: #b26eff;
      gap: 0.6rem;
    }

    .spinner {
      border: 3px solid rgba(178, 110, 255, 0.3);
      border-top: 3px solid #b26eff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #666;
      letter-spacing: 0.3px;
    }

    @media (max-width: 500px) {

      .leaderboard-header,
      .leaderboard-row {
        grid-template-columns: 40px 1fr 50px;
        padding: 0.6rem 0.9rem;
      }

      .user img {
        width: 38px;
        height: 38px;
      }

      .username {
        font-size: 0.9rem;
      }

      .rank,
      .messageCount {
        font-size: 0.9rem;
      }
    }
  </style>  
</head>

<body>

  <h1>Lunar Leaderboard</h1>
  <h2>Weekly Message Rankings</h2>

  <div class="leaderboard" id="leaderboard">
    <div class="leaderboard-header">
      <div class="rank">#</div>
      <div class="user">User</div>
      <div class="messageCount">Msgs</div>
    </div>
    <div id="loading" class="loading">
      <div class="spinner"></div> Loading leaderboard...
    </div>
  </div>

  <footer>Powered by eggrial.lol</footer>

  <script>
    async function fetchLeaderboard() {
      const container = document.getElementById('leaderboard');
      const loading = document.getElementById('loading');

      try {
        const res = await fetch('https://api.eggrial.lol/api/leaderboard/messages');
        const data = await res.json();
        loading.style.display = 'none';

        data.leaderboard.forEach(entry => {
          const row = document.createElement('div');
          row.className = 'leaderboard-row';

          let placeClass = '';
          if (entry.rank === 1) placeClass = 'first-place';
          else if (entry.rank === 2) placeClass = 'second-place';
          else if (entry.rank === 3) placeClass = 'third-place';

          row.innerHTML = `
            <div class="rank">${entry.rank}</div>
            <div class="user ${placeClass}">
              <img src="${entry.avatarURL}" alt="${entry.displayName}">
              <span class="username">${entry.displayName}</span>
            </div>
            <div class="messageCount">${entry.messageCount}</div>
          `;
          container.appendChild(row);
        });
      } catch (err) {
        console.error("Failed to fetch leaderboard:", err);
        loading.innerText = "Failed to load leaderboard.";
      }
    }
    fetchLeaderboard();
  </script>
</body>

</html>
