<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Weekly Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background-color: #1e1e2a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
    }

    h1 {
        font-weight: 700;
        font-size: 2.5rem;
        margin-bottom: 1.5rem;
        color: #ffca28; /* Fortnite-inspired accent */
    }

    .leaderboard {
        width: 100%;
        max-width: 600px;
        background-color: #2c2c3c;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .leaderboard-header, .leaderboard-row {
        display: grid;
        grid-template-columns: 60px 1fr 60px;
        align-items: center;
        padding: 0.8rem 1rem;
    }

    .leaderboard-header {
        background-color: #3a3a50;
        font-weight: 600;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #44445a;
    }

    .leaderboard-row {
        background-color: #2c2c3c;
        border-bottom: 1px solid #3a3a50;
        transition: background 0.2s;
    }

    .leaderboard-row:last-child {
        border-bottom: none;
    }

    .leaderboard-row:hover {
        background-color: #38384e;
    }

    .rank {
        font-weight: 700;
        font-size: 1rem;
        text-align: center;
        color: #ffca28;
    }

    .user {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }

    .user img {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 2px solid #ffca28;
        object-fit: cover;
    }

    .username {
        font-weight: 600;
        font-size: 1rem;
        color: #ffffff;
    }

    .messageCount {
        font-weight: 700;
        font-size: 1rem;
        text-align: center;
        color: #ffca28;
    }

    footer {
        margin-top: 2rem;
        font-size: 0.9rem;
        color: #aaaaaa;
    }

    @media (max-width: 500px) {
        .leaderboard-header, .leaderboard-row {
            grid-template-columns: 40px 1fr 40px;
            padding: 0.6rem 0.8rem;
        }

        .user img {
            width: 35px;
            height: 35px;
        }

        .username {
            font-size: 0.9rem;
        }

        .rank, .messageCount {
            font-size: 0.9rem;
        }
    }
</style>
</head>
<body>

<h1>Lunar Weekly Message Board</h1>

<div class="leaderboard" id="leaderboard">
    <div class="leaderboard-header">
        <div class="rank">#</div>
        <div class="user">User</div>
        <div class="messageCount">Msgs</div>
    </div>
</div>

<footer>Powered by Lunar Community</footer>

<script>
async function fetchLeaderboard() {
    try {
        const res = await fetch('http://api.eggrial.net/api/leaderboard');
        const data = await res.json();

        const container = document.getElementById('leaderboard');

        data.leaderboard.forEach(entry => {
            const row = document.createElement('div');
            row.className = 'leaderboard-row';

            row.innerHTML = `
                <div class="rank">${entry.rank}</div>
                <div class="user">
                    <img src="${entry.avatarURL}" alt="${entry.displayName}">
                    <span class="username">${entry.displayName}</span>
                </div>
                <div class="messageCount">${entry.messageCount}</div>
            `;

            container.appendChild(row);
        });
    } catch (err) {
        console.error("Failed to fetch leaderboard:", err);
    }
}

fetchLeaderboard();
</script>

</body>
</html>
