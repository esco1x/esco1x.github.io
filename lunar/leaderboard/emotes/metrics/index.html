<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lunar Emote Metrics</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --accent:#ff4655;
  --bg-card:rgba(20,20,20,0.7);
  --text-light:#e6e6e6;
  --text-muted:#999;
}

html, body {
  overflow-x: hidden;
  max-width: 100%;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#0f0f0f 0%,#050505 100%);
  color:var(--text-light);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:3rem 1rem;
}

h1{
  font-weight:700;
  font-size:2.8rem;
  color:var(--accent);
  text-transform:uppercase;
  text-shadow:0 0 15px rgba(255,70,85,0.4);
  margin-bottom:0.5rem;
  letter-spacing:2px;
}

h2{
  font-weight:400;
  font-size:1rem;
  color:var(--text-muted);
  margin-bottom:2rem;
}

.metrics-container{
  width:100%;
  max-width:1000px;
  background:var(--bg-card);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,70,85,0.2);
  border-radius:15px;
  padding:2rem;
  box-shadow:0 0 25px rgba(255,70,85,0.05);
  animation:fadeIn .6s ease forwards;
  overflow:hidden;
}

.emote-header{
  display:flex;
  align-items:center;
  gap:1rem;
  background:rgba(255,70,85,0.05);
  border:1px solid rgba(255,70,85,0.2);
  border-radius:12px;
  padding:1rem 1.5rem;
  margin-bottom:1.5rem;
  flex-wrap:wrap;
}

.emote-header img, .emote-header span.emote-icon{
  width:60px;
  height:60px;
  font-size:2.2rem;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%; 
  height:auto;
}

.emote-info{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0; 
}

.emote-info h3{
  margin:0;
  color:var(--accent);
  font-weight:600;
  font-size:1.3rem;
  display:flex;
  align-items:center;
  gap:.6rem;
  flex-wrap:wrap;
}

.emote-rank{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  background:rgba(255,70,85,0.12);
  border-radius:8px;
  padding:.14rem .45rem;
  color:var(--accent);
  line-height:1;
}

.emote-rank i.fa-hashtag{
  font-size:0.85rem;
  color:var(--accent);
  display:inline-block;
  line-height:1;
}

.emote-rank .rank-num{
  font-size:0.82rem;
  font-weight:700;
  color:var(--text-light);
  letter-spacing:0.5px;
}

.emote-info p{
  margin:.2rem 0 0;
  color:var(--text-muted);
  font-size:0.88rem;
  word-break:break-word; 
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1rem;
  margin-bottom:1rem;
}

.stat-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,70,85,0.15);
  border-radius:10px;
  padding:1.2rem;
  text-align:center;
  transition:.18s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.4rem;
}

.stat-card:hover{ background:rgba(255,70,85,0.05); transform:translateY(-3px); }

.stat-card i{
  font-size:1.05rem;
  color:var(--accent);
}

.stat-value{
  font-size:1.6rem;
  color:var(--accent);
  font-weight:700;
}

.stat-label{
  font-size:0.9rem;
  color:var(--text-muted);
}

.emote-warning{
  margin-top:1rem;
  padding:1rem 1.2rem;
  border-radius:10px;
  background:rgba(255,70,85,0.1);
  color:var(--accent);
  font-weight:500;
  font-size:0.92rem;
  display:flex;
  align-items:center;
  gap:0.6rem;
  box-shadow:0 0 10px rgba(255,70,85,0.12);
}

.emote-warning i{
  font-size:1.05rem;
}

.sections{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.2rem;
  margin-top:1.4rem;
  width:100%; 
}

.section{
  background:rgba(25,25,25,0.75);
  border:1px solid rgba(255,70,85,0.15);
  border-radius:10px;
  padding:1rem;
}

.section-title{
  font-weight:700;
  color:var(--accent);
  font-size:1.05rem;
  border-bottom:1px solid rgba(255,70,85,0.2);
  margin-bottom:0.6rem;
  padding-bottom:0.3rem;
}

.item{
  background:rgba(35,35,35,0.5);
  border-radius:8px;
  padding:.6rem .8rem;
  margin-bottom:.5rem;
  border-left:3px solid var(--accent);
  word-break:break-word;
  transition:.12s;
}

.item:hover{ background:rgba(255,70,85,0.04); }

.item-line{
  display:flex;
  justify-content:space-between;
  font-size:0.9rem;
  flex-wrap:wrap;
}

.item-line strong{ color:var(--accent); }

footer{ margin-top:2rem; font-size:0.85rem; color:#666; }

.loading{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:2rem;
  color:var(--accent);
  gap:.6rem;
}

.spinner{ border:3px solid rgba(255,70,85,0.3); border-top:3px solid var(--accent); border-radius:50%; width:20px; height:20px; animation:spin 1s linear infinite; }

@keyframes spin{ 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
@keyframes fadeIn{ from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);} }

@media (max-width:768px){
  body{ padding:2rem 1rem; }
  h1{ font-size:2rem; }
  h2{ font-size:.95rem; }
  .emote-header{ flex-direction:column; text-align:center; gap:.6rem; }
  .emote-info h3{ font-size:1.1rem; }
  .stats-grid{ grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.8rem;}
  .sections{ grid-template-columns:1fr; gap:1rem;}
  .item-line{ flex-direction:column; align-items:flex-start; gap:.3rem;}
  .item{ padding:.5rem .7rem;}
}
</style>
</head>
<body>
<h1>Lunar Emote Metrics</h1>
<!-- <h2 id="emote-subtitle">Loading...</h2> -->

<div class="metrics-container" id="metrics-container">
  <div id="loading" class="loading"><div class="spinner"></div> Loading emote metrics...</div>
</div>

<footer>Powered by eggrial.lol</footer>

<script>
async function fetchEmoteMetrics(){
  const params = new URLSearchParams(window.location.search);
  const emojiId = params.get('emojiId');
  const container = document.getElementById('metrics-container');
  const loading = document.getElementById('loading');

  if(!emojiId){
    loading.innerText = 'No emote specified.';
    return;
  }

  try{
    const res = await fetch('https://api.eggrial.lol/api/leaderboard/emotes');
    const data = await res.json();
    const emoteData = (data && Array.isArray(data.leaderboard)) ? data.leaderboard.find(e => e.id === emojiId) : null;

    if(!emoteData){
      loading.innerText = 'Emote not found.';
      return;
    }

    loading.style.display = 'none';
    // document.getElementById('emote-subtitle').innerText = `Metrics for "${emoteData.name}"`;

    const header = document.createElement('div');
    header.className = 'emote-header';

    const emoteIconHtml = emoteData.isCustom
      ? `<img src="${emoteData.emoteUrl}" alt="${emoteData.name}">`
      : `<span class="emote-icon">${emoteData.emote}</span>`;

    const rankText = (emoteData.rank !== undefined && emoteData.rank !== null) ? `${emoteData.rank}` : 'N/A';
    const rankHtml = `<span class="emote-rank" aria-label="Rank"><i class="fa-solid fa-hashtag" aria-hidden="true"></i><span class="rank-num">${rankText}</span></span>`;

    header.innerHTML = `
      ${emoteIconHtml}
      <div class="emote-info">
        <h3>${escapeHtml(emoteData.name)} ${rankHtml}</h3>
        <p>ID: ${escapeHtml(String(emoteData.id ?? '—'))}</p>
      </div>
    `;
    container.appendChild(header);

    emoteData.users = Array.isArray(emoteData.users) ? emoteData.users : [];
    emoteData.channels = Array.isArray(emoteData.channels) ? emoteData.channels : [];
    emoteData.messages = Array.isArray(emoteData.messages) ? emoteData.messages : [];

    const totalMessages = emoteData.messages.length;
    const totalUserUses = emoteData.users.reduce((sum, u) => sum + (u.count || 0), 0);

    const stats = document.createElement('div');
    stats.className = 'stats-grid';
    stats.innerHTML = `
      <div class="stat-card"><i class="fa-solid fa-chart-column" aria-hidden="true"></i><div class="stat-value">${emoteData.count || 0}</div><div class="stat-label">Total Uses</div></div>
      <div class="stat-card"><i class="fa-solid fa-users" aria-hidden="true"></i><div class="stat-value">${emoteData.users.length}</div><div class="stat-label">Unique Users</div></div>
      <div class="stat-card"><i class="fa-solid fa-hashtag" aria-hidden="true"></i><div class="stat-value">${emoteData.channels.length}</div><div class="stat-label">Channels Used</div></div>
      <div class="stat-card"><i class="fa-solid fa-message" aria-hidden="true"></i><div class="stat-value">${totalMessages}</div><div class="stat-label">Messages Counted</div></div>
    `;
    container.appendChild(stats);

    function createWarning(iconClass, message){
      const d = document.createElement('div');
      d.className = 'emote-warning';
      d.innerHTML = `<i class="fa-solid ${iconClass}" aria-hidden="true"></i><span>${escapeHtml(message)}</span>`;
      return d;
    }

    const allEmpty = emoteData.users.length === 0 && emoteData.channels.length === 0 && emoteData.messages.length === 0;
    if(allEmpty && (emoteData.count || 0) > 0){
      container.appendChild(createWarning('fa-triangle-exclamation', 'Metrics for this emote were added after the initial counter. To update metrics, send this emote again in chat.'));
    }

    if (totalUserUses !== emoteData.count && !allEmpty) {
      container.appendChild(createWarning('fa-circle-exclamation', `The total emote uses (${emoteData.count}) don’t match the sum of user counts (${totalUserUses}). Some data may be outdated or inconsistent.`));
    }

    const sections = document.createElement('div');
    sections.className = 'sections';

    function createSection(title, items, type){
      if(!items || items.length === 0) return null;
      const s = document.createElement('div');
      s.className = 'section';
      s.innerHTML = `<div class="section-title">${escapeHtml(title)}</div>`;
      items.forEach(it => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        if(type === 'user'){
          itemDiv.innerHTML = `<div class="item-line"><strong>${escapeHtml(it.username || it.id || 'Unknown')}</strong><span>${it.count || 0} uses</span></div>`;
        } else if(type === 'channel'){
          itemDiv.innerHTML = `<div class="item-line"><strong>#${escapeHtml(it.name || it.id || 'Unknown')}</strong><span>${it.count || 0} uses</span></div>`;
        } else if(type === 'message'){
          const content = escapeHtml(it.content || 'No content');
          const author = escapeHtml(it.authorTag || it.authorId || 'Unknown');
          const when = it.timestamp ? new Date(it.timestamp).toLocaleString() : 'Unknown time';
          itemDiv.innerHTML = `<div class="item-line"><strong>${author}</strong><span>${when}</span></div><div style="margin-top:.35rem; color:var(--text-muted);">${content}</div>`;
        }
        s.appendChild(itemDiv);
      });
      return s;
    }

    const topUsers = createSection('Top Users', emoteData.users.slice().sort((a,b)=> (b.count||0)-(a.count||0)).slice(0,5), 'user');
    const topChannels = createSection('Top Channels', emoteData.channels.slice().sort((a,b)=> (b.count||0)-(a.count||0)).slice(0,5), 'channel');
    const recentMessages = createSection('Recent Messages', emoteData.messages.slice().sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp)).slice(0,5), 'message');

    [topUsers, topChannels, recentMessages].forEach(x => x && sections.appendChild(x));
    container.appendChild(sections);

  }catch(err){
    console.error(err);
    loading.innerText = 'Failed to load metrics.';
  }
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

fetchEmoteMetrics();
</script>
</body>
</html>
