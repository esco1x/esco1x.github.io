<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Emote Metrics</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #0f0f0f 0%, #050505 100%);
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 3rem 1rem;
  }
  h1 { font-weight: 700; font-size: 2.8rem; color: #ff4655; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,70,85,0.4); }
  h2 { font-weight: 400; font-size: 1rem; color: #aaa; margin-bottom: 2rem; letter-spacing: 0.5px; }
  .metrics-container { width: 100%; max-width: 900px; background: rgba(20,20,20,0.85); border: 1px solid rgba(255,70,85,0.2); border-radius: 15px; box-shadow: 0 0 25px rgba(255,70,85,0.05); padding: 2rem; animation: fadeIn 0.6s ease forwards; display: flex; flex-direction: column; gap: 1rem; }
  .emote-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  .emote-header img, .emote-header span { width: 64px; height: 64px; font-size: 2.5rem; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
  .section { margin-bottom: 1rem; background: rgba(25,25,25,0.8); padding: 1rem; border-radius: 10px; }
  .section-title { font-weight: 700; color: #ff4655; font-size: 1.1rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,70,85,0.2); padding-bottom: 0.3rem; }
  .item { display: flex; flex-direction: column; padding: 0.6rem 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); word-break: break-word; border-radius: 5px; background: rgba(35,35,35,0.5); margin-bottom: 0.4rem; }
  .item:last-child { margin-bottom: 0; border-bottom: none; }
  .item-line { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  .item-line strong { color: #ff4655; }
  .nested { padding-left: 1rem; margin-top: 0.3rem; }
  .loading { display: flex; justify-content: center; align-items: center; padding: 2rem; font-size: 1rem; color: #ff4655; gap: 0.6rem; }
  .spinner { border: 3px solid rgba(255,70,85,0.3); border-top: 3px solid #ff4655; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  footer { margin-top: 2rem; font-size: 0.9rem; color: #666; letter-spacing: 0.3px; }
</style>
</head>
<body>
<h1>Lunar Emote Metrics</h1>
<h2 id="emote-subtitle">Loading...</h2>

<div class="metrics-container" id="metrics-container">
  <div id="loading" class="loading">
    <div class="spinner"></div> Loading emote metrics...
  </div>
</div>

<footer>Powered by eggrial.lol</footer>

<script>
async function fetchEmoteMetrics() {
  const params = new URLSearchParams(window.location.search);
  const emojiId = params.get('emojiId');
  const container = document.getElementById('metrics-container');
  const loading = document.getElementById('loading');

  if (!emojiId) {
    loading.innerText = 'No emote specified.';
    return;
  }

  try {
    const res = await fetch('https://api.eggrial.lol/api/leaderboard/emotes');
    const data = await res.json();
    const emoteData = data.leaderboard.find(e => e.id === emojiId);

    if (!emoteData) {
      loading.innerText = 'Emote not found.';
      return;
    }

    loading.style.display = 'none';
    document.getElementById('emote-subtitle').innerText = `Metrics for "${emoteData.name}"`;

    // Emote header
    const header = document.createElement('div');
    header.className = 'emote-header';
    if (emoteData.isCustom) {
      header.innerHTML = `<img src="${emoteData.emoteUrl}" alt="${emoteData.name}">`;
    } else {
      header.innerHTML = `<span>${emoteData.emote}</span>`;
    }
    container.appendChild(header);

    // Helper: create a styled section
    function createSection(title, items) {
      if (!items || (Array.isArray(items) && items.length === 0)) return;
      const section = document.createElement('div');
      section.className = 'section';
      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.innerText = title;
      section.appendChild(sectionTitle);

      if (Array.isArray(items)) {
        items.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'item';
          if (typeof item === 'object') {
            if (item.content && item.authorTag && item.channelId) {
              // Message block styling
              const authorLine = document.createElement('div');
              authorLine.className = 'item-line';
              authorLine.innerHTML = `<strong>Author:</strong> ${item.authorTag}`;
              const channelLine = document.createElement('div');
              channelLine.className = 'item-line';
              channelLine.innerHTML = `<strong>Channel ID:</strong> ${item.channelId}`;
              const contentLine = document.createElement('div');
              contentLine.className = 'item-line';
              contentLine.innerHTML = `<strong>Content:</strong> ${item.content}`;
              const timestampLine = document.createElement('div');
              timestampLine.className = 'item-line';
              timestampLine.innerHTML = `<strong>Timestamp:</strong> ${new Date(item.timestamp).toLocaleString()}`;

              itemDiv.append(authorLine, channelLine, contentLine, timestampLine);
            } else {
              Object.entries(item)
                .filter(([k]) => !['_id','__v', 'emote' ].includes(k))
                .forEach(([k,v]) => {
                  const line = document.createElement('div');
                  line.className = 'item-line';
                  line.innerHTML = `<strong>${k}:</strong> ${v}`;
                  itemDiv.appendChild(line);
                });
            }
          } else {
            itemDiv.innerText = item;
          }
          section.appendChild(itemDiv);
        });
      } else if (typeof items === 'object') {
        Object.entries(items).forEach(([k,v]) => {
          if (['_id','__v', 'emote' ].includes(k)) return;
          const itemDiv = document.createElement('div');
          itemDiv.className = 'item';
          itemDiv.innerHTML = `<strong>${k}:</strong> ${v}`;
          section.appendChild(itemDiv);
        });
      }

      container.appendChild(section);
    }

    // Section ordering: Emote details first, then Users, Channels, Messages
    const {users, channels, messages, ...details} = emoteData;

    createSection('Emote Details', details);
    createSection('Top Users', users);
    createSection('Top Channels', channels);
    createSection('Recent Messages', messages);

  } catch (err) {
    console.error('Failed to fetch emote metrics:', err);
    loading.innerText = 'Failed to load emote metrics.';
  }
}

fetchEmoteMetrics();
</script>
</body>
</html>
