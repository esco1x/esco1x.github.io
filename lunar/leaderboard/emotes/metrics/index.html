<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Emote Metrics</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #ff4655;
  --bg-dark: #0a0a0a;
  --bg-card: rgba(20,20,20,0.7);
  --text-light: #e6e6e6;
  --text-muted: #999;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #0f0f0f 0%, #050505 100%);
  color: var(--text-light);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 3rem 1rem;
}

h1 {
  font-weight: 700;
  font-size: 2.8rem;
  color: var(--accent);
  text-transform: uppercase;
  text-shadow: 0 0 15px rgba(255,70,85,0.4);
  margin-bottom: 0.5rem;
  letter-spacing: 2px;
}

h2 {
  font-weight: 400;
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 2rem;
}

.metrics-container {
  width: 100%;
  max-width: 1000px;
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,70,85,0.2);
  border-radius: 15px;
  padding: 2rem;
  box-shadow: 0 0 25px rgba(255,70,85,0.05);
  animation: fadeIn 0.6s ease forwards;
}

.emote-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: rgba(255,70,85,0.05);
  border: 1px solid rgba(255,70,85,0.2);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1.5rem;
}

.emote-header img, .emote-header span {
  width: 64px;
  height: 64px;
  font-size: 2.5rem;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.emote-info {
  display: flex;
  flex-direction: column;
}

.emote-info h3 {
  margin: 0;
  color: var(--accent);
  font-weight: 600;
  font-size: 1.5rem;
}

.emote-info p {
  margin: 0.2rem 0 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}

.stat-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,70,85,0.15);
  border-radius: 10px;
  padding: 1.2rem;
  text-align: center;
  transition: 0.2s;
}

.stat-card:hover {
  background: rgba(255,70,85,0.05);
  transform: translateY(-3px);
}

.stat-value {
  font-size: 1.8rem;
  color: var(--accent);
  font-weight: 700;
}

.stat-label {
  font-size: 0.9rem;
  color: var(--text-muted);
}

.emote-warning {
  margin-top: 1rem;
  padding: 1rem;
  border: 1px solid var(--accent);
  border-radius: 10px;
  background: rgba(255,70,85,0.1);
  color: var(--accent);
  font-weight: 500;
  font-size: 0.95rem;
}

.sections {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
  margin-top: 1.5rem;
}

.section {
  background: rgba(25,25,25,0.75);
  border: 1px solid rgba(255,70,85,0.15);
  border-radius: 10px;
  padding: 1rem;
}

.section-title {
  font-weight: 700;
  color: var(--accent);
  font-size: 1.1rem;
  border-bottom: 1px solid rgba(255,70,85,0.2);
  margin-bottom: 0.6rem;
  padding-bottom: 0.3rem;
}

.item {
  background: rgba(35,35,35,0.5);
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
  margin-bottom: 0.5rem;
  border-left: 3px solid var(--accent);
  word-break: break-word;
}

.item-line {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  flex-wrap: wrap;
}

.item-line strong {
  color: var(--accent);
}

footer {
  margin-top: 2rem;
  font-size: 0.85rem;
  color: #666;
}

.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  color: var(--accent);
  gap: 0.6rem;
}

.spinner {
  border: 3px solid rgba(255,70,85,0.3);
  border-top: 3px solid var(--accent);
  border-radius: 50%;
  width: 20px;
  height: 20px;
  animation: spin 1s linear infinite;
}

/* Animations */
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

/* Responsive styles */
@media (max-width: 768px) {
  body { padding: 2rem 1rem; }
  h1 { font-size: 2rem; }
  h2 { font-size: 0.95rem; }

  .emote-header { flex-direction: column; text-align: center; gap: 0.5rem; }
  .emote-info h3 { font-size: 1.3rem; }

  .stats-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
  .sections { grid-template-columns: 1fr; gap: 1rem; }

  .item-line { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
  .item { padding: 0.5rem 0.7rem; }
  .stat-card { padding: 1rem; }
}
</style>
</head>
<body>
<h1>Lunar Emote Metrics</h1>
<h2 id="emote-subtitle">Loading...</h2>

<div class="metrics-container" id="metrics-container">
  <div id="loading" class="loading">
    <div class="spinner"></div> Loading emote metrics...
  </div>
</div>

<footer>Powered by eggrial.lol</footer>

<script>
async function fetchEmoteMetrics() {
  const params = new URLSearchParams(window.location.search);
  const emojiId = params.get('emojiId');
  const container = document.getElementById('metrics-container');
  const loading = document.getElementById('loading');

  if (!emojiId) {
    loading.innerText = 'No emote specified.';
    return;
  }

  try {
    const res = await fetch('https://api.eggrial.lol/api/leaderboard/emotes');
    const data = await res.json();
    const emoteData = data.leaderboard.find(e => e.id === emojiId);

    if (!emoteData) {
      loading.innerText = 'Emote not found.';
      return;
    }

    loading.style.display = 'none';
    document.getElementById('emote-subtitle').innerText = `Metrics for "${emoteData.name}"`;

    // Header
    const header = document.createElement('div');
    header.className = 'emote-header';
    header.innerHTML = `
      ${emoteData.isCustom ? `<img src="${emoteData.emoteUrl}" alt="${emoteData.name}">` : `<span>${emoteData.emote}</span>`}
      <div class="emote-info">
        <h3>${emoteData.name}</h3>
      </div>`;
    container.appendChild(header);

    // Safe defaults
    emoteData.users = Array.isArray(emoteData.users) ? emoteData.users : [];
    emoteData.channels = Array.isArray(emoteData.channels) ? emoteData.channels : [];
    emoteData.messages = Array.isArray(emoteData.messages) ? emoteData.messages : [];

    const totalMessages = emoteData.messages.length;
    const totalUserUses = emoteData.users.reduce((a, b) => a + (b.count || 0), 0);

    // Stats grid
    const stats = document.createElement('div');
    stats.className = 'stats-grid';
    stats.innerHTML = `
      <div class="stat-card"><div class="stat-value">${emoteData.count || 0}</div><div class="stat-label">Total Uses</div></div>
      <div class="stat-card"><div class="stat-value">${emoteData.users.length}</div><div class="stat-label">Unique Users</div></div>
      <div class="stat-card"><div class="stat-value">${emoteData.channels.length}</div><div class="stat-label">Channels Used</div></div>
      <div class="stat-card"><div class="stat-value">${totalMessages}</div><div class="stat-label">Messages Counted</div></div>`;
    container.appendChild(stats);

    // --- Warning system ---

    // 1️⃣ Only show “added after initial counter” if *all* arrays are empty
    const allEmpty =
      emoteData.users.length === 0 &&
      emoteData.channels.length === 0 &&
      emoteData.messages.length === 0;

    if (allEmpty && (emoteData.count || 0) > 0) {
      const oldWarn = document.createElement('div');
      oldWarn.className = 'emote-warning';
      oldWarn.innerText =
        '⚠️ Metrics for this emote were added after the initial counter. To update metrics, send this emote again in chat.';
      container.appendChild(oldWarn);
    }

    // 2️⃣ Show mismatch warning only if user totals don’t match total uses
    if (totalUserUses !== emoteData.count && !allEmpty) {
      const mismatchWarn = document.createElement('div');
      mismatchWarn.className = 'emote-warning';
      mismatchWarn.innerText = `❗ The total emoji uses (${emoteData.count}) don’t match the sum of user counts (${totalUserUses}). Some data may be outdated or inconsistent.`;
      container.appendChild(mismatchWarn);
    }

    // --- Sections ---
    const sections = document.createElement('div');
    sections.className = 'sections';

    function createSection(title, items, type) {
      if (!items || items.length === 0) return null;
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `<div class="section-title">${title}</div>`;
      items.forEach(i => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        if (type === 'user') {
          itemDiv.innerHTML = `<div class="item-line"><strong>${i.username}</strong><span>${i.count} uses</span></div>`;
        } else if (type === 'channel') {
          itemDiv.innerHTML = `<div class="item-line"><strong>#${i.name}</strong><span>${i.count} uses</span></div>`;
        } else if (type === 'message') {
          itemDiv.innerHTML = `<div class="item-line"><strong>${i.authorTag}</strong><span>${new Date(i.timestamp).toLocaleString()}</span></div><div>${i.content || 'No content'}</div>`;
        }
        section.appendChild(itemDiv);
      });
      return section;
    }

    const topUsers = createSection('Top Users', emoteData.users.sort((a, b) => b.count - a.count).slice(0, 5), 'user');
    const topChannels = createSection('Top Channels', emoteData.channels.sort((a, b) => b.count - a.count).slice(0, 5), 'channel');
    const recentMessages = createSection('Recent Messages', emoteData.messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 5), 'message');

    [topUsers, topChannels, recentMessages].forEach(s => s && sections.appendChild(s));
    container.appendChild(sections);

  } catch (err) {
    console.error(err);
    loading.innerText = 'Failed to load metrics.';
  }
}

fetchEmoteMetrics();
</script>
</body>
</html>
